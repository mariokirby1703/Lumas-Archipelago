# Copy this file and change SonicPlayer to your AP player name.
# Settings below use the current defaults. See docs/setup.md for installation.
name: SonicPlayer
game: Sonic Colours (Wii)
Sonic Colours (Wii):

  # Progression
  # nega_wisp_armor / all_bosses / all_red_rings
  goal: nega_wisp_armor
  # unlock_acts_in_order / all_acts_then_boss
  world_progression: all_acts_then_boss
  boost_lock: true
  movement_unlocks: true
  super_sonic: false

  # Checks
  # singles / per_level
  red_ring_checks: singles
  # off / s / a / b / c / all
  rank_checks: 'off'
  one_up_sanity: false
  wisp_discovery_checks: true

  # Game Land
  # When off, also disables Emerald and Eggman Heart checks and removes AP Red Ring items.
  game_land_checks: true
  chaos_emerald_checks: false
  eggman_heart_sanity: true
  # 0-99 percent reduction in Game Land unlock costs.
  game_land_requirement_reduction: 50

  # Traps
  # Percentage of remaining filler slots replaced with traps.
  trap_percentage: 10
  # off / low / medium / high
  ring_loss_trap_weight: medium
  # off / low / medium / high
  score_reset_trap_weight: low
  # off / low / medium / high
  dead_weight_trap_weight: low

  # Red Ring Colors
  red_ring_item_colors: true
  # Use gold, blue, gray and orange for Red Rings and item HUD text.
  colorblind_mode: false
  # always_red / red_ring_items_only / item_classification
  own_item_red_ring_colors: item_classification
  # red / random
  trap_red_ring_colors: random

  # Miscellaneous
  music_randomization: true
  death_link: false
