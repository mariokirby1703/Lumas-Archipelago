# Sonic Colours (Wii) custom player YAML / slot schema 7
# Run this with the matching APWorld and an entirely NEW seed.
# The normal PAL Wii intro is always Tropical Resort Acts 1 and 2.
# Open the generated player patch to build a separate native AP ISO.
# See docs/setup.md; no manual AP Gecko/Riivolution setup is required.
name: SonicPlayer
game: Sonic Colours (Wii)
Sonic Colours (Wii):
  # nega_wisp_armor / all_bosses / all_red_rings /
  # nega_wisp_armor / all_bosses / all_red_rings
  goal: nega_wisp_armor
  # sequential: Act 1 -> 2 -> 3 -> 4 -> 5 -> 6 -> Boss
  # open_acts: all six Acts at World Access, Boss after all six clears
  world_progression: all_acts_then_boss
  # off / singles / per_level
  red_ring_checks: singles
  # off / s / a / b / c / all
  rank_checks: 'off'
  game_land_checks: true
  chaos_emerald_checks: true
  wisp_discovery_checks: false
  wisp_capsules: false
  eggman_heart_sanity: false
  boost_lock: false
  movement_unlocks: false
  game_land_requirement_reduction: 50  # 0..99 percent; 50% = old 90, 99% = old 179
  # true enables seed-based music shuffling in the local ISO build;
  # see docs/sonic_colours.md for remaining live verification.
  music_randomization: true
  trap_percentage: 10
  ring_loss_trap_weight: medium
  death_link: false  # Selectable; PAL live validation still incomplete
