# Sonic Colours (Wii) Archipelago player YAML, experimental v0.7.0 / slot schema 7
# Run this with the matching APWorld and an entirely NEW seed.
# The normal PAL Wii intro is always Tropical Resort Acts 1 and 2.
# For experimental native code without Gecko, use the client CLI opt-in
# described in docs/runtime_experiments.md (a crash is possible).
name: SonicPlayer
game: Sonic Colours (Wii)
Sonic Colours (Wii):
  # nega_wisp_armor / all_bosses / all_red_rings /
  # nega_wisp_armor / all_bosses / all_red_rings
  goal: nega_wisp_armor
  # sequential: Act 1 -> 2 -> 3 -> 4 -> 5 -> 6 -> Boss
  # open_acts: all six Acts at World Access, Boss after all six clears
  world_progression: sequential
  # off / singles / per_level
  red_ring_checks: singles
  # off / s / a / b / c / all
  rank_checks: 'off'
  game_land_checks: true
  chaos_emerald_checks: true
  wisp_discovery_checks: false
  wisp_capsules: false
  eggman_heart_sanity: false
  boost_lock: false
  movement_unlocks: false
  game_land_requirement_reduction: 40
  # true enables original PAL CSB synth shuffling directly in RAM;
  # audible playback in maps/Game Land is experimental.
  music_randomization: true
  trap_percentage: 10
  ring_loss_trap_weight: medium
  death_link: false
